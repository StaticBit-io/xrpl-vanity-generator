name: dotnet

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

# A newer push makes a running PR check pointless. On dev and main the running job is kept, but
# GitHub still replaces a pending run when a newer one queues, so a commit there can end up with
# no result of its own.
concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The same content otherwise runs twice: in its pull request and again on the push to dev or main.
  # A job that passed on commit tree T leaves an artifact ci-passed-<job>-<T>, and gate skips the job
  # when it finds one. The tree, not the commit: a pull request runs on the synthetic
  # refs/pull/N/merge commit, while the squash commit on dev is a different commit with the same
  # content. If dev moved on while the pull request waited, the trees differ and the job runs again.
  # An API error finds no marker, so the job runs rather than being skipped.
  gate:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
    outputs:
      tree: ${{ steps.check.outputs.tree }}
      windows: ${{ steps.check.outputs.windows }}
      linux: ${{ steps.check.outputs.linux }}
    steps:
      - name: Find markers for this tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha) || tree=""
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          for job in windows linux; do
            passed=false
            if [ -n "$tree" ] && n=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$job-$tree" \
                --jq '[.artifacts[] | select(.expired | not)] | length') && [ "$n" -gt 0 ]; then
              passed=true
            fi
            echo "$job: $passed (tree $tree)"
            echo "$job=$passed" >> "$GITHUB_OUTPUT"
          done

  # The only place the desktop application builds and the DPAPI tests run. Hosted runners have no
  # GPU, so the CUDA and OpenCL rows skip here.
  windows:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.windows != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-windows
      - run: dotnet build XrplVanity.sln -c Release
        env:
          # Scoped to the build for the reason given in linux/Dockerfile: DartSassBuilder ships a
          # net8.0 tool, and the test executables must not be rolled forward with it.
          DOTNET_ROLL_FORWARD: LatestMajor
      # RealGpu tests need a real card, which hosted runners lack; they run on a developer machine.
      - run: dotnet run --project tests/XrplVanity.Tests -c Release --no-build -- -trait- "Category=RealGpu"
      - run: dotnet run --project tests/XrplVanity.App.Tests -c Release --no-build
      - name: Mark the tree as tested
        if: needs.gate.outputs.tree != ''
        shell: bash
        run: echo "$GITHUB_RUN_ID" > ci-passed
      - uses: actions/upload-artifact@v4
        if: needs.gate.outputs.tree != ''
        with:
          name: ci-passed-windows-${{ needs.gate.outputs.tree }}
          path: ci-passed
          retention-days: 14

  # The documented CPU-only harness: both suites with OpenCL required on pocl, then the CLI smokes.
  linux:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.linux != 'true' }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    # About 6 minutes for the suite on a 4-CPU container once the RealGpu tests are left out; the
    # margin covers a slower runner without letting a hang burn the budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash linux/run-linux-tests.sh --cpu-only
      - name: Mark the tree as tested
        if: needs.gate.outputs.tree != ''
        run: echo "$GITHUB_RUN_ID" > ci-passed
      - uses: actions/upload-artifact@v4
        if: needs.gate.outputs.tree != ''
        with:
          name: ci-passed-linux-${{ needs.gate.outputs.tree }}
          path: ci-passed
          retention-days: 14

  # Publishes the package once both suites pass on main, which only merges from dev reach. A tag
  # marks the commit a version was published from, so every run compares with that commit and not
  # with the previous push: a run that failed or was replaced is made up for by the next one, and a
  # library change without a new version keeps failing until the version is raised. The feed itself
  # is not read, so a version deleted from it stays tagged, and the job will not publish it again.
  # If the tag cannot be pushed after a publish, the next run fails on the duplicate: check that the
  # version is on the feed, then add the tag by hand.
  # A merge from dev usually gives main a tree dev already tested, so gate skips both suites; a
  # marker counts as a pass here, because it was left by a passing run on this same tree.
  package:
    needs: [gate, windows, linux]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (needs.windows.result == 'success' || needs.gate.outputs.windows == 'true')
      && (needs.linux.result == 'success' || needs.gate.outputs.linux == 'true') }}
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      PROJECT: src/XrplVanity.Core/XrplVanity.Core.csproj
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: find out whether there is a version to publish
        id: release
        run: |
          version=$(sed -n 's:.*<PackageVersion>\(.*\)</PackageVersion>.*:\1:p' "$PROJECT")
          : "${version:?no PackageVersion in $PROJECT}"
          if ! git rev-parse --quiet --verify "refs/tags/core-v$version" > /dev/null; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "core-v$version" "$GITHUB_SHA" -- src/XrplVanity.Core; then
            echo "::error file=$PROJECT::src/XrplVanity.Core changed since $version was published. Raise PackageVersion on dev and merge into main again."
            exit 1
          fi
      - if: steps.release.outputs.version
        run: dotnet pack "$PROJECT" -c Release -o artifacts
      # No --skip-duplicate: with no tag for this version, finding it on the feed is a real conflict.
      - if: steps.release.outputs.version
        run: dotnet nuget push "artifacts/StaticBit.XrplVanity.Core.$VERSION.nupkg" --source https://nuget.pkg.github.com/StaticBit-io/index.json --api-key "$FEED_TOKEN"
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.release.outputs.version
        run: |
          git tag "core-v$VERSION" "$GITHUB_SHA"
          git push origin "core-v$VERSION"
        env:
          VERSION: ${{ steps.release.outputs.version }}
