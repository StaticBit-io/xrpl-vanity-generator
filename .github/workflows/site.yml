name: site

on:
  push:
    branches: [dev, main]
  pull_request:
  # Publishing is only ever this: Actions > site > Run workflow, with the branch to publish. main is the
  # Pages production branch; dev goes to its preview address.
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish
        required: true
        type: choice
        options:
          - dev
          - main

jobs:
  test:
    # A pull request from a fork never reaches the self-hosted runner; see dotnet.yml.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The site tests run from the repository root. They read the README, the docs and the CLI parser,
      # so a change to any of those can fail here.
      - run: node --test site/test/*.test.mjs
      - run: node site/build.mjs

  # The job waits for "test", which ran on the same branch, so a red suite never goes live.
  deploy-site:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    # Two runs in quick succession deploy in order; cancelling the older run could leave the earlier
    # commit live if it finished last.
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.151.1
      PROJECT: xrpl-vanity-site
      BRANCH: ${{ inputs.branch }}
    steps:
      # Without a token wrangler falls back to an interactive login and fails with a message that
      # does not name the missing secret.
      - name: the Cloudflare secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required to deploy the site" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node site/build.mjs
      # In a non-interactive run, "pages deploy" fails on a missing project instead of offering to
      # create it, so the first deploy creates it here. A failed lookup (bad token) fails the job
      # rather than falling through to "create".
      - name: create the Pages project on first deploy
        run: |
          projects=$($WRANGLER pages project list --json)
          if ! printf '%s' "$projects" | grep -q "\"$PROJECT\""; then
            $WRANGLER pages project create "$PROJECT" --production-branch main
          fi
      # From site/: site/wrangler.toml names the project and the output directory. The hash comes from
      # the checkout because the run may start from another branch than the one published.
      - run: $WRANGLER pages deploy --branch "$BRANCH" --commit-hash "$(git rev-parse HEAD)"
        working-directory: site
